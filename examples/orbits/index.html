<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gg • Orbits</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font: 14px system-ui, sans-serif;
        background: #0b0d17;
        color: #cdd3e0;
      }
      /* The orrery fills the page, and the rest float over it */
      .orrery {
        position: fixed;
        inset: 0;
      }
      .controls,
      .status,
      .chart {
        position: fixed;
        left: 12px;
        box-sizing: border-box;
        width: min(calc(100vw - 24px), 420px);
        padding: 8px;
        background: rgb(11 13 23 / 0.7);
        border: 1px solid #262c44;
        border-radius: 6px;
        backdrop-filter: blur(4px);
      }
      .controls {
        top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .status {
        bottom: 124px;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .chart {
        bottom: 12px;
        height: 100px;
      }
      button {
        font: inherit;
        padding: 4px 10px;
        color: inherit;
        background: #1b2033;
        border: 1px solid #343b57;
        border-radius: 4px;
        cursor: pointer;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
        font-variant-numeric: tabular-nums;
      }
      /* Fixed widths, so a label that changes moves no other button */
      .run {
        width: 5em;
      }
      .view {
        width: 9em;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .trail {
        fill: none;
        opacity: 0.45;
        vector-effect: non-scaling-stroke;
      }
      .line {
        fill: none;
        stroke: #6cf;
        vector-effect: non-scaling-stroke;
      }
      text {
        fill: #8a93ad;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <section class="orrery"></section>
    <div class="controls"></div>
    <p class="status"></p>
    <section class="chart"></section>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
