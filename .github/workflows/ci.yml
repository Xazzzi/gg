name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run checks
      - run: npm run test:branches
      - run: npm run test:perf
      - run: npm run build
      - run: node learn-gg.ts

  # Tests need no install, and Node 22 applies the test timeout to the whole file.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --expose-gc --test --test-timeout=2000 --test-reporter=dot tests/index.test.ts
